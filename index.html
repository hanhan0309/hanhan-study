  <title>含含开心学习</title>
  <style>
    :root{--pink-bg:#FFE4ED;--pink-soft:#FFF0F5;--pink-mid:#FFC1D9;--pink-strong:#FF6FA5;--pink-deep:#E91E63;--text:#4A2C3A;--text-muted:#A8788A;--white:#FFFFFF;--shadow:0 6px 20px rgba(233,30,99,0.12);--radius:18px;--radius-sm:12px}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;color:var(--text);background:linear-gradient(135deg,#FFD6E8 0%,#FFEFF5 50%,#FFD6E8 100%);overflow:hidden}body{display:flex;flex-direction:column;height:100vh;height:100dvh}.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-bottom:2px solid var(--pink-mid);flex-shrink:0}.title-block{display:flex;align-items:center;gap:8px}.logo-emoji{font-size:28px}h1{font-size:20px;color:var(--pink-deep);letter-spacing:1px;text-shadow:1px 1px 0 #fff}.header-actions{display:flex;gap:6px}.btn{border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;cursor:pointer;transition:all 0.18s;font-family:inherit;touch-action:manipulation}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn-primary{background:var(--pink-strong);color:white}.btn-primary:hover{background:var(--pink-deep)}.btn-ghost{background:rgba(255,255,255,0.7);color:var(--pink-deep);border:1px solid var(--pink-mid)}.btn-ghost:hover{background:var(--pink-soft)}.btn-add{background:var(--pink-strong);color:white;font-weight:600}.btn-add:hover{background:var(--pink-deep)}.btn-tiny{background:transparent;color:var(--pink-deep);font-size:11px;padding:4px 10px;border:1px dashed var(--pink-mid);border-radius:16px}.btn-tiny:hover{background:var(--pink-soft)}.btn-close{background:transparent;font-size:22px;color:var(--text-muted);padding:0 6px}.btn-close:hover{color:var(--pink-deep)}.layout{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}.card{background:rgba(255,255,255,0.85);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid rgba(255,193,217,0.5)}h2{font-size:15px;color:var(--pink-deep);margin-bottom:4px}h3{font-size:14px;color:var(--pink-deep);margin-bottom:6px}.calendar-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calendar-head #monthLabel{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--pink-deep)}.nav-btn{width:30px;height:30px;border:none;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);font-size:18px;cursor:pointer;transition:all 0.15s}.nav-btn:hover{background:var(--pink-mid)}.today-btn{border:1px solid var(--pink-mid);background:#fff;color:var(--pink-deep);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}.today-btn:hover{background:var(--pink-soft)}.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}.calendar-weekdays span{text-align:center;font-size:11px;color:var(--text-muted);padding:3px 0}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:10px;cursor:pointer;font-size:12px;position:relative;background:var(--pink-soft);transition:all 0.15s;max-width:48px;-webkit-tap-highlight-color:transparent}.cal-day:active{background:var(--pink-mid)}.cal-day.other-month{color:var(--text-muted);opacity:0.4}.cal-day.today{background:var(--pink-strong);color:white;font-weight:700}.cal-day.selected{outline:2px solid var(--pink-deep);outline-offset:1px}.cal-day.has-task::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;background:var(--pink-deep);border-radius:50%}.cal-day.achieved::after{content:'\2713';position:absolute;bottom:1px;font-size:9px;color:#fff;background:var(--pink-deep);width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.cal-day.achieved.has-task::after{content:'\2713'}.cal-day.today.achieved::after{background:white;color:var(--pink-deep)}.calendar-legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:10px;color:var(--text-muted)}.calendar-legend span{display:flex;align-items:center;gap:3px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot-task{background:var(--pink-strong)}.dot-done{background:var(--pink-deep)}.dot-today{background:var(--pink-strong)}.task-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}#selectedDateLabel{font-size:15px}.progress-mini{display:flex;align-items:center;gap:6px}#progressText{font-size:12px;font-weight:700;color:var(--pink-deep);min-width:36px;text-align:right}.progress-bar{width:100px;height:8px;background:var(--pink-soft);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-strong),var(--pink-deep));border-radius:4px;transition:width 0.4s;width:0%}.task-add{display:flex;gap:6px;margin-bottom:6px}#taskInput{flex:1;padding:9px 12px;border:2px solid var(--pink-mid);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:#fff;outline:none;transition:border 0.15s}#taskInput:focus{border-color:var(--pink-strong)}.task-quick{margin-bottom:8px}.task-list{display:flex;flex-direction:column;gap:6px}.task-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--pink-mid);transition:all 0.2s}.task-item.done{background:var(--pink-soft);opacity:0.85}.task-item.done .task-title{text-decoration:line-through;color:var(--text-muted)}.task-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--pink-mid);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all 0.15s;-webkit-tap-highlight-color:transparent}.task-check:active{border-color:var(--pink-strong <body>
  <header class="app-header">
    <div class="title-block"><span class="logo-emoji">🎀</span><h1>含含开心学习</h1></div>
    <div class="header-actions"><button class="btn btn-ghost" id="templateBtn">📋 模板</button></div>
  </header>
  <main class="layout">
    <section class="card calendar-card">
      <div class="calendar-head">
        <button class="nav-btn" id="prevMonth">‹</button><span id="monthLabel"></span><button class="nav-btn" id="nextMonth">›</button><button class="today-btn" id="todayBtn">今天</button>
      </div>
      <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-legend"><span><i class="dot dot-task"></i>有任务</span><span><i class="dot dot-done"></i>已达标</span><span><i class="dot dot-today"></i>今天</span></div>
    </section>
    <section class="card task-card">
      <div class="task-head"><h2 id="selectedDateLabel"></h2><div class="progress-mini"><span id="progressText">0%</span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></div>
      <div class="task-add"><input type="text" id="taskInput" placeholder="✏️ 输入任务，按回车添加" /><button class="btn btn-add" id="addTaskBtn">＋ 添加</button></div>
      <div class="task-quick"><button class="btn btn-tiny" id="useTemplateBtn">⭐ 从模板带入今天</button></div>
      <div class="task-list" id="taskList"></div>
      <div class="task-empty show" id="taskEmpty"><span class="empty-emoji">🌸</span><p>今天还没有任务</p><p class="muted">在上方输入框添加你的学习计划吧</p></div>
    </section>
    <section class="card melody-card">
      <h2 class="melody-title">🐱 美乐蒂</h2>
      <div class="melody-stage" id="melodyStage"></div>
      <div class="melody-status">
        <div class="status-row"><span class="status-label">饱腹度</span><div class="status-bar"><div class="status-fill satiety" id="satietyBar"></div></div><span id="satietyText">0%</span></div>
        <div class="status-row"><span class="status-label">清洁度</span><div class="status-bar"><div class="status-fill clean" id="cleanBar"></div></div><span id="cleanText">0%</span></div>
      </div>
      <div class="melody-bubble" id="melodyBubble"></div>
      <div class="melody-stats"><div class="stat"><span class="stat-num" id="streakDays">0</span><span class="stat-label">连续达标</span></div><div class="stat"><span class="stat-num" id="totalDays">0</span><span class="stat-label">累计达标</span></div></div>
    </section>
    <section class="card tip-card"><h3>💡 使用说明</h3><ul class="tip-list"><li>点击日历选择日期，每天可手动添加学习任务</li><li>每项任务完成后点 ☑️，并可上传照片或视频</li><li>当天完成 ≥ 70%，美乐蒂就能吃饱洗澡</li><li>常用任务可存为模板，一键带入</li></ul></section>
  </main>
  <div class="modal" id="templateModal">
    <div class="modal-content">
      <div class="modal-head"><h3>📋 常用任务模板</h3><button class="btn btn-close" id="closeTemplate">×</button></div>
      <div class="template-add"><input type="text" id="templateInput" placeholder="如：练字一页" /><button class="btn btn-add" id="addTemplateBtn">＋ 存为模板</button></div>
      <div class="template-list" id="templateList"></div>
      <div class="modal-foot"><button class="btn btn-primary" id="applyTemplateBtn">✅ 一键带入今天</button></div>
    </div>
  </div>
  <div class="modal" id="attachModal">
    <div class="modal-content media-modal">
      <div class="modal-head"><h3 id="attachTitle">附件预览</h3><button class="btn btn-close" id="closeAttach">×</button></div>
      <div class="media-stage" id="mediaStage"></div>
    </div>
  </div>
  <div class="celebrate-overlay" id="celebrateOverlay"></div>
  <script>// 美乐蒂小猫 SVG 生成器
// 两套状态：happy（达标，干净吃饱）/ sad（未达标，瘦瘦脏脏）
// 加上动画状态：eating（吃饭）+ bathing（洗澡）

function melodySVG(state = 'happy') {
  // 公共部分：粉色帽兜 + 蝴蝶结 + 白色小猫
  const happy = `
    <!-- 身体（圆润吃饱） -->
    <ellipse cx="200" cy="340" rx="95" ry="80" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="3"/>
    <!-- 头 -->
    <ellipse cx="200" cy="210" rx="110" ry="100" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="3"/>
    <!-- 左耳 -->
    <path d="M 120 130 Q 100 70 145 65 Q 165 90 168 130 Z" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="3"/>
    <!-- 右耳 -->
    <path d="M 280 130 Q 300 70 255 65 Q 235 90 232 130 Z" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="3"/>
    <!-- 粉色帽兜 -->
    <path d="M 120 130 Q 200 30 280 130 Q 295 150 275 165 Q 200 140 125 165 Q 105 150 120 130 Z" fill="#FF9EC4" stroke="#E91E63" stroke-width="2.5"/>
    <circle cx="125" cy="165" r="10" fill="#FFF0F5" stroke="#E91E63" stroke-width="2"/>
    <circle cx="200" cy="142" r="10" fill="#FFF0F5" stroke="#E91E63" stroke-width="2"/>
    <circle cx="275" cy="165" r="10" fill="#FFF0F5" stroke="#E91E63" stroke-width="2"/>
    <!-- 蝴蝶结 -->
    <g transform="translate(115,120) rotate(-15)">
      <path d="M 0 0 L -24 -14 L -24 14 Z" fill="#FF4081"/>
      <path d="M 0 0 L 24 -14 L 24 14 Z" fill="#FF4081"/>
      <circle cx="0" cy="0" r="6" fill="#E91E63"/>
    </g>
    <!-- 眼睛（开心弯月） -->
    <path d="M 165 200 Q 178 185 191 200" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 209 200 Q 222 185 235 200" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="158" cy="230" rx="16" ry="9" fill="#FFB6C1" opacity="0.7"/>
    <ellipse cx="242" cy="230" rx="16" ry="9" fill="#FFB6C1" opacity="0.7"/>
    <!-- 嘴巴（微笑） -->
    <path d="M 185 240 Q 200 256 215 240" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
    <!-- 小爪子 -->
    <ellipse cx="150" cy="410" rx="22" ry="14" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="2.5"/>
    <ellipse cx="250" cy="410" rx="22" ry="14" fill="#FFFFFF" stroke="#F8BBD0" stroke-width="2.5"/>
  `;

  const sad = `
    <!-- 身体（瘦瘦的） -->
    <ellipse cx="200" cy="345" rx="72" ry="68" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="3"/>
    <!-- 头（瘦） -->
    <ellipse cx="200" cy="210" rx="98" ry="92" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="3"/>
    <!-- 左耳（耷拉） -->
    <path d="M 128 135 Q 105 95 138 80 Q 160 110 165 140 Z" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="3" transform="rotate(-8 140 110)"/>
    <!-- 右耳（耷拉） -->
    <path d="M 272 135 Q 295 95 262 80 Q 240 110 235 140 Z" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="3" transform="rotate(8 260 110)"/>
    <!-- 帽兜（颜色暗淡） -->
    <path d="M 120 130 Q 200 30 280 130 Q 295 150 275 165 Q 200 140 125 165 Q 105 150 120 130 Z" fill="#E0A0B8" stroke="#BDBDBD" stroke-width="2.5"/>
    <circle cx="125" cy="165" r="10" fill="#EFE0E8" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="200" cy="142" r="10" fill="#EFE0E8" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="275" cy="165" r="10" fill="#EFE0E8" stroke="#BDBDBD" stroke-width="2"/>
    <!-- 蝴蝶结（歪了） -->
    <g transform="translate(115,120) rotate(-30)">
      <path d="M 0 0 L -24 -14 L -24 14 Z" fill="#C0C0C0"/>
      <path d="M 0 0 L 24 -14 L 24 14 Z" fill="#C0C0C0"/>
      <circle cx="0" cy="0" r="6" fill="#9E9E9E"/>
    </g>
    <!-- 眼睛（难过） -->
    <ellipse cx="178" cy="205" rx="8" ry="11" fill="#2B2B2B"/>
    <ellipse cx="222" cy="205" rx="8" ry="11" fill="#2B2B2B"/>
    <!-- 眉毛（八字） -->
    <path d="M 165 180 L 185 188" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 235 180 L 215 188" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
    <!-- 脏污 -->
    <ellipse cx="160" cy="230" rx="14" ry="7" fill="#9E9E9E" opacity="0.5"/>
    <ellipse cx="245" cy="245" rx="10" ry="5" fill="#9E9E9E" opacity="0.5"/>
    <ellipse cx="200" cy="280" rx="18" ry="6" fill="#9E9E9E" opacity="0.4"/>
    <!-- 嘴巴（撇嘴） -->
    <path d="M 188 250 Q 200 240 212 250" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
    <!-- 瘦小爪子 -->
    <ellipse cx="158" cy="410" rx="16" ry="10" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="2.5"/>
    <ellipse cx="242" cy="410" rx="16" ry="10" fill="#F5F5F5" stroke="#D7CCC8" stroke-width="2.5"/>
    <!-- 头顶灰尘小符号 -->
    <text x="115" y="90" font-size="20" fill="#9E9E9E">~</text>
    <text x="270" y="95" font-size="18" fill="#9E9E9E">~</text>
  `;

  const body = state === 'happy' ? happy : sad;
  const animClass = state === 'happy' ? 'melody-happy' : 'melody-sad';

  return `
    <svg class="melody-svg ${animClass}" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="halo-${state}" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#FFF0F5" stop-opacity="0"/>
        </radialGradient>
      </defs>
      ${state === 'happy' ? '<circle cx="200" cy="220" r="180" fill="url(#halo-happy)"/>' : ''}
      ${body}
      ${state === 'happy' ? '<text x="200" y="50" font-size="34" text-anchor="middle">✨</text>' : '<text x="200" y="55" font-size="30" text-anchor="middle">💭</text>'}
    </svg>
  `;
}

// 达标瞬间的"吃饭+洗澡"庆祝动画层
function celebrateOverlay() {
  return `
    <div class="celebrate-overlay" id="celebrateOverlay">
      <div class="celebrate-scene">
        <div class="celebrate-step" data-step="eat">
          <span class="big-emoji">🍚</span>
          <p>美乐蒂饱餐一顿！</p>
        </div>

  <script>// Web 版 API 桥接 —— 模拟 Electron 的 window.api，用 localStorage + IndexedDB
// 供纯 HTML 环境使用，配合 PWA 实现手机桌面安装

(function initWebApi() {
  if (window.api) return; // 已经是 Electron 环境

  const DB_NAME = 'hanhan-study';
  const STORE = 'attachments';
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE)) {
          req.result.createObjectStore(STORE, { keyPath: 'name' });
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  window.api = {
    // 数据：用 localStorage 存储
    loadData: async () => {
      try {
        const raw = localStorage.getItem('hanhan-data');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { tasks: {}, templates: [], achievements: {} };
    },
    saveData: async (data) => {
      try {
        localStorage.setItem('hanhan-data', JSON.stringify(data));
      } catch (e) {
        console.error('保存数据失败', e);
      }
    },

    // 附件：存 IndexedDB（base64）
    saveAttachment: async (name, buffer) => {
      await openDB();
      const tx = db.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      const unique = Date.now() + '_' + String(name).replace(/[^\w.\-\u4e00-\u9fa5]/g, '_');
      const bytes = new Uint8Array(buffer);
      let b64 = '';
      for (let i = 0; i < bytes.length; i++) {
        b64 += String.fromCharCode(bytes[i]);
      }
      const record = {
        name: unique,
        data: btoa(b64),
        originalName: name,
        type: 'application/octet-stream'
      };
      await new Promise((resolve, reject) => {
        const req = store.put(record);
        req.onsuccess = resolve;
        req.onerror = reject;
      });
      return { path: unique, name: unique };
    },

    readAttachment: async (name) => {
      await openDB();
      const tx = db.transaction(STORE, 'readonly');
      const store = tx.objectStore(STORE);
      const record = await new Promise((resolve, reject) => {
        const req = store.get(name);
        req.onsuccess = () => resolve(req.result);
        req.onerror = reject;
      });
      return record ? record.data : null;
    },

    openAttachment: async (name) => {
      // 纯 Web 环境：下载
      const b64 = await window.api.readAttachment(name);
      if (!b64) return;
      const a = document.createElement('a');
      a.href = 'data:application/octet-stream;base64,' + b64;
      a.download = name;
      a.click();
    }
  };
})();
</script>
  <script>// ===== 含含开心学习 - 主逻辑 =====
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const ACHIEVE_THRESHOLD = 0.7; // 70% 达标

let state = {
  data: { tasks: {}, templates: [], achievements: {} },
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(),
  selectedDate: todayStr()
};

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ===== 数据加载 =====
async function loadData() {
  state.data = await window.api.loadData();
  if (!state.data.tasks) state.data.tasks = {};
  if (!state.data.templates) state.data.templates = [];
  if (!state.data.achievements) state.data.achievements = {};
}
async function saveData() {
  await window.api.saveData(state.data);
}

// ===== 日历渲染 =====
function renderCalendar() {
  const y = state.viewYear, m = state.viewMonth;
  $('#monthLabel').textContent = `${y}年${m+1}月`;
  const first = new Date(y, m, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  const grid = $('#calendarGrid');
  grid.innerHTML = '';

  // 上月尾巴
  for (let i = startDay - 1; i >= 0; i--) {
    const d = prevDays - i;
    const cell = makeDayCell(y, m-1, d, true);
    grid.appendChild(cell);
  }
  // 本月
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = makeDayCell(y, m, d, false);
    grid.appendChild(cell);
  }
  // 下月开头补齐到 42 格
  const total = startDay + daysInMonth;
  const tail = (7 - (total % 7)) % 7;
  for (let d = 1; d <= tail; d++) {
    const cell = makeDayCell(y, m+1, d, true);
    grid.appendChild(cell);
  }
}

function makeDayCell(y, m, d, otherMonth) {
  // 规范化月份
  let yy = y, mm = m;
  if (mm < 0) { yy--; mm = 11; }
  if (mm > 11) { yy++; mm = 0; }
  const ds = fmtDate(yy, mm, d);
  const cell = document.createElement('div');
  cell.className = 'cal-day';
  if (otherMonth) cell.classList.add('other-month');
  if (ds === todayStr()) cell.classList.add('today');
  if (ds === state.selectedDate) cell.classList.add('selected');
  if (state.data.tasks[ds] && state.data.tasks[ds].length > 0) cell.classList.add('has-task');
  if (state.data.achievements[ds]) cell.classList.add('achieved');
  cell.textContent = d;
  cell.addEventListener('click', () => {
    state.selectedDate = ds;
    renderCalendar();
    renderTasks();
    renderMelody();
  });
  return cell;
}

// ===== 任务渲染 =====
function renderTasks() {
  const ds = state.selectedDate;
  const [y, m, d] = ds.split('-').map(Number);
  const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  const wd = new Date(y, m-1, d).getDay();
  $('#selectedDateLabel').textContent = `${m}月${d}日 ${weekDays[wd]}`;

  const today = todayStr();
  const tl = $('#todayLabel');
  if (tl) tl.textContent = `今天是 ${today.replace(/-/g, '/')} ${weekDays[new Date().getDay()]}`;

  const tasks = state.data.tasks[ds] || [];
  const list = $('#taskList');
  list.innerHTML = '';
  const empty = $('#taskEmpty');

  if (tasks.length === 0) {
    empty.classList.add('show');
  } else {
    empty.classList.remove('show');
    tasks.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'task-item' + (t.done ? ' done' : '');

      const check = document.createElement('div');
      check.className = 'task-check';
      check.textContent = t.done ? '✓' : '';
      check.addEventListener('click', async () => {
        t.done = !t.done;
        await saveData();
        renderTasks();
        renderCalendar();
        await checkAchievement(ds);
        renderMelody();
      });

      const body = document.createElement('div');
      body.className = 'task-body';
      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;
      body.appendChild(title);

      // 附件按钮
      const attachBtn = document.createElement('button');
      attachBtn.className = 'task-attach-btn';
      if (t.attachment) attachBtn.classList.add('has-file');
      attachBtn.innerHTML = t.attachment ? '📎 已上传附件' : '📷 上传照片/视频';
      attachBtn.addEventListener('click', () => onAttachment(t, attachBtn));
      body.appendChild(attachBtn);

      // 附件缩略图（图片）
      if (t.attachment && t.attachment.type && t.attachment.type.startsWith('image/')) {
        loadAttachmentThumb(t.attachment.path).then(src => {
          if (src) {
            const img = document.createElement('img');
            img.className = 'attach-thumb';
            img.src = src;
            img.addEventListener('click', () => openAttachModal(t.attachment));
            body.appendChild(img);
          }
        });
      } else if (t.attachment && t.attachment.type && t.attachment.type.startsWith('video/')) {
        const badge = document.createElement('div');
        badge.className = 'attach-thumb';
        badge.style.display = 'flex';
        badge.style.alignItems = 'center';
        badge.style.justifyContent = 'center';
        badge.style.background = '#000';
        badge.style.color = '#fff';
        badge.style.fontSize = '24px';
        badge.textContent = '🎬';
        badge.style.cursor = 'pointer';
        badge.addEventListener('click', () => openAttachModal(t.attachment));
        body.appendChild(badge);
      }

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      const del = document.createElement('button');
      del.className = 'task-del';
      del.textContent = '🗑';
      del.title = '删除任务';
      del.addEventListener('click', async () => {
        state.data.tasks[ds].splice(i, 1);
        if (state.data.tasks[ds].length === 0) delete state.data.tasks[ds];
        await saveData();
        renderTasks();
        renderCalendar();
        await checkAchievement(ds);
        renderMelody();
      });
      actions.appendChild(del);

      item.appendChild(check);
      item.appendChild(body);
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  // 进度
  const done = tasks.filter(t => t.done).length;
  const pct = tasks.length === 0 ? 0 : Math.round(done / tasks.length * 100);
  $('#progressText').textContent = `${pct}%`;
  $('#progressFill').style.width = pct + '%';
}

// ===== 附件处理 =====
async function onAttachment(task, btn) {
  if (task.attachment) {
    // 已有附件，直接打开预览
    openAttachModal(task.attachment);
    return;
  }
  // 触发文件选择
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    const result = await window.api.saveAttachment(file.name, buf);
    task.attachment = { path: result.path, name: result.name, type: file.type, originalName: file.name };
    await saveData();
    renderTasks();
  });
  input.click();
}

async function loadAttachmentThumb(filePath) {
  const b64 = await window.api.readAttachment(filePath);
  if (!b64) return null;
  return 'data:image/png;base64,' + b64;
}

async function openAttachModal(attachment) {
  $('#attachTitle').textContent = attachment.originalName || attachment.name;
  const stage = $('#mediaStage');
  stage.innerHTML = '';
  const b64 = await window.api.readAttachment(attachment.path);
  if (!b64) {
    stage.innerHTML = '<p style="color:#fff;">附件读取失败</p>';
  } else if (attachment.type && attachment.type.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + b64;
    stage.appendChild(img);
  } else if (attachment.type && attachment.type.startsWith('video/')) {
    const video = document.createElement('video');
    video.controls = true;
    video.src = 'data:video/mp4;base64,' + b64;
    stage.appendChild(video);
  } else {
    stage.innerHTML = '<p style="color:#fff;">不支持的附件类型</p>';
  }
  // 绑定"用系统程序打开"
  const oae = $('#openAttachExternal');
  if (oae) oae.onclick = () => window.api.openAttachment(attachment.path);
  $('#attachModal').classList.add('show');
}

// ===== 达标判定 =====
async function checkAchievement(ds) {
  const tasks = state.data.tasks[ds] || [];
  if (tasks.length === 0) {
    delete state.data.achievements[ds];
    await saveData();
    return;
  }
  const done = tasks.filter(t => t.done).length;
  const ratio = done / tasks.length;
  const wasAchieved = state.data.achievements[ds] === true;
  if (ratio >= ACHIEVE_THRESHOLD) {
    state.data.achievements[ds] = true;
    await saveData();
    if (!wasAchieved) {
      // 触发庆祝动画
      playCelebrate();
    }
  } else {
    delete state.data.achievements[ds];
    await saveData();
  }
}

// ===== 美乐蒂渲染 =====
function renderMelody() {
  const ds = state.selectedDate;
  const tasks = state.data.tasks[ds] || [];
  const achieved = state.data.achievements[ds] === true;
  const stage = $('#melodyStage');
  const bubble = $('#melodyBubble');

  if (tasks.length === 0) {
    // 没任务：默认开心但提示
    stage.innerHTML = window.Melody.melodySVG('happy');
    bubble.textContent = '含含，先添加今天的学习计划吧！';
  } else if (achieved) {
    stage.innerHTML = window.Melody.melodySVG('happy');
    bubble.textContent = '谢谢含含！今天你真棒！';
  } else {
    stage.innerHTML = window.Melody.melodySVG('sad');
    bubble.textContent = '含含，你要加油噢！';
  }

  // 状态条
  const done = tasks.filter(t => t.done).length;
  const ratio = tasks.length === 0 ? 0 : done / tasks.length;
  const satiety = Math.round(ratio * 100);
  const clean = achieved ? 100 : Math.round(ratio * 80);
  $('#satietyBar').style.width = satiety + '%';
  $('#satietyText').textContent = satiety + '%';
  $('#cleanBar').style.width = clean + '%';
  $('#cleanText').textContent = clean + '%';

  // 统计
  const today = todayStr();
  let streak = 0;
  const d = new Date();
  while (true) {
    const ds2 = fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
    if (state.data.achievements[ds2]) streak++;
    else break;
    d.setDate(d.getDate() - 1);
    if (streak > 365) break;
  }
  $('#streakDays').textContent = streak;
  $('#totalDays').textContent = Object.keys(state.data.achievements).length;
}

// ===== 庆祝动画 =====
function playCelebrate() {
  const overlay = $('#celebrateOverlay');
  overlay.innerHTML = `
    <div class="celebrate-scene">
      <div class="celebrate-step active" data-step="eat">
        <span class="big-emoji">🍚</span>
        <p>美乐蒂饱餐一顿！</p>
      </div>
      <div class="celebrate-step" data-step="bath" style="display:none;">
        <span class="big-emoji">🛁</span>
        <p>洗个香喷喷的澡！</p>
      </div>
      <div class="celebrate-step" data-step="done" style="display:none;">
        <span class="big-emoji">💕</span>
        <p>谢谢含含！今天你真棒！</p>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  const steps = overlay.querySelectorAll('.celebrate-step');
  let i = 0;
  const show = () => {
    steps.forEach(s => s.classList.remove('active'));
    if (i < steps.length) {
      steps[i].classList.add('active');
      i++;
      setTimeout(show, 1300);
    } else {
      setTimeout(() => overlay.classList.remove('show'), 800);
    }
  };
  setTimeout(show, 100);
}

// ===== 模板 =====
function renderTemplates() {
  const list = $('#templateList');
  list.innerHTML = '';
  if (state.data.templates.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:10px;">还没有模板，先添加一些常用任务吧</p>';
    return;
  }
  state.data.templates.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'template-item';
    item.innerHTML = `<span>${escapeHtml(t)}</span>`;
    const del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = '🗑';
    del.addEventListener('click', async () => {
      state.data.templates.splice(i, 1);
      await saveData();
      renderTemplates();
    });
    item.appendChild(del);
    list.appendChild(item);
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== 事件绑定 =====
function bindEvents() {
  // 月份切换
  $('#prevMonth').addEventListener('click', () => {
    state.viewMonth--;
    if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
    renderCalendar();
  });
  $('#nextMonth').addEventListener('click', () => {
    state.viewMonth++;
    if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
    renderCalendar();
  });
  $('#todayBtn').addEventListener('click', () => {
    const d = new Date();
    state.viewYear = d.getFullYear();
    state.viewMonth = d.getMonth();
    state.selectedDate = todayStr();
    renderCalendar();
    renderTasks();
    renderMelody();
  });

  // 添加任务
  const addTask = async () => {
    const input = $('#taskInput');
    const v = input.value.trim();
    if (!v) return;
    const ds = state.selectedDate;
    if (!state.data.tasks[ds]) state.data.tasks[ds] = [];
    state.data.tasks[ds].push({ id: uid(), title: v, done: false, attachment: null });
    input.value = '';
    await saveData();
    renderTasks();
    renderCalendar();
    renderMelody();
  };
  $('#addTaskBtn').addEventListener('click', addTask);
  $('#taskInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

  // 模板弹窗
  $('#templateBtn').addEventListener('click', () => {
    renderTemplates();
    $('#templateModal').classList.add('show');
  });
  $('#closeTemplate').addEventListener('click', () => $('#templateModal').classList.remove('show'));
  $('#addTemplateBtn').addEventListener('click', async () => {
    const v = $('#templateInput').value.trim();
    if (!v) return;
    state.data.templates.push(v);
    $('#templateInput').value = '';
    await saveData();
    renderTemplates();
  });
  $('#applyTemplateBtn').addEventListener('click', async () => {
    const ds = state.selectedDate;
    if (!state.data.tasks[ds]) state.data.tasks[ds] = [];
    state.data.templates.forEach(t => {
      // 避免重复添加
      if (!state.data.tasks[ds].some(x => x.title === t)) {
        state.data.tasks[ds].push({ id: uid(), title: t, done: false, attachment: null });
      }
    });
    await saveData();
    $('#templateModal').classList.remove('show');
    renderTasks();
    renderCalendar();
    renderMelody();
  });

  // 一键带入今天
  $('#useTemplateBtn').addEventListener('click', async () => {
    if (state.data.templates.length === 0) {
      // 没模板就打开模板弹窗
      renderTemplates();
      $('#templateModal').classList.add('show');
      return;
    }
    state.selectedDate = todayStr();
    const ds = state.selectedDate;
    if (!state.data.tasks[ds]) state.data.tasks[ds] = [];
    state.data.templates.forEach(t => {
      if (!state.data.tasks[ds].some(x => x.title === t)) {
        state.data.tasks[ds].push({ id: uid(), title: t, done: false, attachment: null });
      }
    });
    await saveData();
    renderCalendar();
    renderTasks();
    renderMelody();
  });

  // 附件弹窗关闭
  $('#closeAttach').addEventListener('click', () => $('#attachModal').classList.remove('show'));

  // 点击遮罩关闭
  [$('#templateModal'), $('#attachModal')].forEach(m => {
    m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show'); });
  });
}

// ===== 启动 =====
(async function init() {
  await loadData();
  bindEvents();
  renderCalendar();
  renderTasks();
  renderMelody();
})();
