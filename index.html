<!DOCTYPE html>
<html lang="zh-CN" data-theme="melody">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="含含开心学习"/>
<meta name="theme-color" content="#FFE4ED"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<title>含含开心学习</title>
<style>
:root,[data-theme="melody"]{--bg:#FFE4ED;--bg2:#FFF0F5;--bg3:#FFC1D9;--primary:#FF6FA5;--deep:#E91E63;--text:#4A2C3A;--text2:#A8788A;--white:#FFFFFF;--nav:#FF6FA5;--nav-text:#fff;--card:rgba(255,255,255,0.85);--star:#FF9800}
[data-theme="kuromi"]{--bg:#E8D5F5;--bg2:#F3E8FA;--bg3:#D4A8E8;--primary:#9C27B0;--deep:#6A1B9A;--text:#2D1B4E;--text2:#8B6BAA;--white:#FFFFFF;--nav:#9C27B0;--nav-text:#fff;--card:rgba(255,255,255,0.85);--star:#FFD600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 50%,var(--bg3) 80%,var(--bg) 100%);overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-bottom:2px solid var(--bg3);flex-shrink:0;z-index:10}
.title-block{display:flex;align-items:center;gap:6px}
.title-block .icon{font-size:24px}
h1{font-size:18px;color:var(--deep);letter-spacing:1px}
.header-actions{display:flex;gap:4px}
.btn{border:none;border-radius:12px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;font-family:inherit;touch-action:manipulation;background:var(--bg2);color:var(--deep);border:1px solid var(--bg3)}
.btn:active{transform:scale(0.95)}
.btn-p{background:var(--primary);color:white;border:none}
.btn-s{background:var(--deep);color:white;border:none;padding:6px 10px;font-size:11px}
.tab-content{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;display:none;padding:10px 12px 70px}
.tab-content.active{display:block}
/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);z-index:50;padding:env(safe-area-inset-bottom,0) 0 0}
.nav-item{flex:1;text-align:center;padding:8px 0 6px;color:rgba(255,255,255,0.6);font-size:11px;cursor:pointer;border:none;background:none;font-family:inherit;transition:all 0.2s}
.nav-item .ni{font-size:22px;display:block;margin-bottom:2px}
.nav-item.active{color:white;font-weight:700}
/* 每日任务页 - 双栏布局 */
.task-layout{display:flex;gap:10px;align-items:flex-start}
.mascot-panel{flex:0 0 140px;text-align:center;background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 4px 16px rgba(0,0,0,0.08);position:sticky;top:0}
.mascot-panel svg{width:110px;height:120px}
.stars-badge{background:linear-gradient(135deg,var(--star),#FF5722);color:white;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;margin-top:6px;display:inline-block}
.right-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,0.07);border:1px solid var(--bg3)}
h2{font-size:14px;color:var(--deep);margin-bottom:6px}
.calendar-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.calendar-head span{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--deep)}
.nav-btn{width:26px;height:26px;border:none;border-radius:50%;background:var(--bg2);color:var(--deep);font-size:16px;cursor:pointer}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.calendar-weekdays span{text-align:center;font-size:10px;color:var(--text2);padding:2px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:11px;background:var(--bg2);-webkit-tap-highlight-color:transparent}
.cal-day:active{background:var(--bg3)}
.cal-day.other-month{opacity:0.3}
.cal-day.today{background:var(--primary);color:white;font-weight:700}
.cal-day.selected{outline:2px solid var(--deep);outline-offset:-1px}
.cal-day.has-task::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;background:var(--deep);border-radius:50%}
.task-add{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.task-add input{flex:1;min-width:100px;padding:7px 10px;border:2px solid var(--bg3);border-radius:10px;font-size:12px;font-family:inherit;background:white;outline:none}
.task-add input:focus{border-color:var(--primary)}
.task-add select{padding:7px 6px;border:2px solid var(--bg3);border-radius:10px;font-size:12px;background:white;color:var(--text)}
.task-list{display:flex;flex-direction:column;gap:5px}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:white;border-radius:12px;border:1px solid var(--bg3);font-size:12px}
.task-item.done{background:var(--bg2);opacity:0.8}
.task-item.done .task-title{text-decoration:line-through;color:var(--text2)}
.task-body{flex:1;min-width:0}
.task-title{font-size:12px;word-break:break-word;line-height:1.3}
.task-meta{font-size:10px;color:var(--text2);margin-top:2px}
.task-stars{color:var(--star);font-weight:700}
.task-attach-btn{display:inline-flex;align-items:center;gap:2px;margin-top:3px;font-size:10px;color:var(--deep);background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:2px 7px;cursor:pointer}
.task-attach-btn.has-file{background:#E8F5E9;border-color:#A5D6A7;color:#2E7D32}
.task-del{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px 4px}
.task-empty{display:none;text-align:center;padding:20px 0;color:var(--text2);font-size:12px}
.task-empty.show{display:block}
/* 星星商城 */
.shop-header{text-align:center;margin-bottom:10px}
.shop-stars{font-size:28px;font-weight:700;color:var(--star)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shop-item{background:var(--card);border-radius:14px;padding:10px;text-align:center;border:2px solid transparent;transition:all 0.2s}
.shop-item .si{font-size:36px;display:block;margin-bottom:4px}
.shop-item .sn{font-size:12px;font-weight:600;color:var(--text)}
.shop-item .sc{font-size:11px;color:var(--star);font-weight:700;margin-top:4px}
.shop-item .buy-btn{display:inline-block;margin-top:6px;padding:4px 14px;background:var(--primary);color:white;border:none;border-radius:10px;font-size:11px;cursor:pointer;font-family:inherit}
.shop-item .buy-btn:active{transform:scale(0.95)}
.shop-item.purchased{border-color:var(--primary);opacity:0.7}
.shop-item.purchased .buy-btn{background:#aaa}
/* 家长模式管理 */
.parent-tools{margin-top:10px;display:none}
.parent-tools.show{display:block}
.parent-tools input,.parent-tools select{padding:6px 8px;border:2px solid var(--bg3);border-radius:8px;font-size:11px;margin:3px;font-family:inherit}
/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:white;border-radius:16px;padding:16px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal-foot{margin-top:10px;display:flex;justify-content:flex-end;gap:6px}
input[type="text"],input[type="password"],input[type="number"]{width:100%;padding:8px 10px;border:2px solid var(--bg3);border-radius:10px;font-size:13px;font-family:inherit;outline:none;margin-bottom:6px}
input:focus{border-color:var(--primary)}
.celebrate-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.95);z-index:300;align-items:center;justify-content:center;flex-direction:column}
.celebrate-overlay.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header class="app-header">
  <div class="title-block"><span class="icon" id="themeIcon">🎀</span><h1>含含开心学习</h1></div>
  <div class="header-actions">
    <button class="btn" id="themeBtn">🎨 主题</button>
    <button class="btn" id="syncBtn">🔄</button>
    <button class="btn" id="parentBtn">🔒</button>
  </div>
</header>

<!-- 每日任务 Tab -->
<div class="tab-content active" id="tabTasks">
  <div class="task-layout">
    <div class="mascot-panel" id="mascotPanel"></div>
    <div class="right-main">
      <div class="card">
        <div class="calendar-head">
          <button class="nav-btn" id="prevMonth">‹</button><span id="monthLabel"></span><button class="nav-btn" id="nextMonth">›</button>
        </div>
        <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="card" id="taskCard">
        <h2 id="selectedDateLabel"></h2>
        <div class="task-add" id="taskAddRow" style="display:none">
          <input type="text" id="taskInput" placeholder="✏️ 输入任务名称" />
          <select id="starSelect"><option value="1">⭐1</option><option value="2">⭐2</option><option value="3" selected>⭐3</option><option value="5">⭐5</option><option value="10">⭐10</option></select>
          <button class="btn btn-p" id="addTaskBtn">＋</button>
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="task-empty show" id="taskEmpty">🌸 今天还没有任务<br><small style="color:var(--text2)">家长模式下可添加任务</small></div>
      </div>
    </div>
  </div>
</div>

<!-- 星星商城 Tab -->
<div class="tab-content" id="tabShop">
  <div class="shop-header">
    <div style="font-size:14px;color:var(--text2)">我的星星</div>
    <div class="shop-stars">⭐ <span id="shopStarCount">0</span></div>
  </div>
  <div class="shop-grid" id="shopGrid"></div>
  <div class="parent-tools" id="parentTools">
    <div class="card" style="margin-top:10px">
      <h3>🔧 家长管理</h3>
      <div style="display:flex;gap:4px;align-items:center;margin-bottom:4px">
        <span style="font-size:12px">手动增减星星：</span>
        <input type="number" id="starDelta" value="5" style="width:60px;margin:0" />
        <button class="btn btn-p" id="addStarsBtn">＋加星</button>
        <button class="btn" id="subStarsBtn" style="color:#E53935">－减星</button>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <input type="text" id="newItemName" placeholder="物品名称" style="width:80px;margin:0" />
        <input type="text" id="newItemIcon" placeholder="图标emoji" style="width:60px;margin:0" />
        <input type="number" id="newItemCost" placeholder="价格" style="width:60px;margin:0" />
        <select id="newItemCat" style="margin:0"><option>装扮</option><option>实物</option></select>
        <button class="btn btn-p" id="addShopItemBtn">＋添加</button>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗们 -->
<div class="modal" id="parentModal">
  <div class="modal-content">
    <div class="modal-head"><h3>🔒 家长模式</h3><button class="btn btn-close" id="closeParent">×</button></div>
    <input type="password" id="parentPassword" placeholder="请输入密码" />
    <div class="modal-foot"><button class="btn btn-p" id="loginParent">进入</button></div>
    <p style="font-size:11px;color:var(--text2);text-align:center;margin-top:6px" id="parentMsg"></p>
  </div>
</div>

<div class="modal" id="syncModal">
  <div class="modal-content">
    <div class="modal-head"><h3>🔄 同步设置</h3><button class="btn btn-close" id="closeSync">×</button></div>
    <input type="password" id="tokenInput" placeholder="GitHub Token" />
    <div class="modal-foot"><button class="btn btn-p" id="saveTokenBtn">保存</button></div>
    <p id="syncStatus" style="font-size:11px;color:var(--text2);text-align:center;margin-top:4px"></p>
  </div>
</div>

<div class="modal" id="attachModal">
  <div class="modal-content" style="max-width:96vw">
    <div class="modal-head"><h3 id="attachTitle">附件</h3><button class="btn btn-close" id="closeAttach">×</button></div>
    <div id="mediaStage" style="display:flex;align-items:center;justify-content:center;min-height:150px;background:#000;border-radius:10px;overflow:hidden"></div>
  </div>
</div>

<div class="modal" id="themeModal">
  <div class="modal-content" style="text-align:center">
    <div class="modal-head"><h3>🎨 选择主题</h3><button class="btn btn-close" id="closeTheme">×</button></div>
    <div style="display:flex;gap:12px;justify-content:center">
      <div style="cursor:pointer;padding:16px;border-radius:14px;border:3px solid #FF6FA5" id="pickMelody">
        <div style="font-size:48px">🐱</div><div style="font-size:13px;font-weight:600;color:#E91E63">美乐蒂</div>
      </div>
      <div style="cursor:pointer;padding:16px;border-radius:14px;border:3px solid #CE93D8" id="pickKuromi">
        <div style="font-size:48px">😈</div><div style="font-size:13px;font-weight:600;color:#9C27B0">库洛米</div>
      </div>
    </div>
  </div>
</div>

<div class="celebrate-overlay" id="celebrateOverlay"></div>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="tabTasks"><span class="ni">📋</span>每日任务</button>
  <button class="nav-item" data-tab="tabShop"><span class="ni">⭐</span>星星商城</button>
</nav>

<script src="melody.js?v=3"></script>
<script src="kuromi.js?v=3"></script>
<script src="web-api.js?v=3"></script>
<script src="renderer.js?v=3"></script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=3')}</script>
</body>
</html>
