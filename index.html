<title>含含开心学习</title>
<style>
    :root{--pink-bg:#FFE4ED;--pink-soft:#FFF0F5;--pink-mid:#FFC1D9;--pink-strong:#FF6FA5;--pink-deep:#E91E63;--text:#4A2C3A;--text-muted:#A8788A;--white:#FFFFFF;--shadow:0 6px 20px rgba(233,30,99,0.12);--radius:18px;--radius-sm:12px}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;color:var(--text);background:linear-gradient(135deg,#FFD6E8 0%,#FFEFF5 50%,#FFD6E8 100%);overflow:hidden}body{display:flex;flex-direction:column;height:100vh;height:100dvh}.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-bottom:2px solid var(--pink-mid);flex-shrink:0}.title-block{display:flex;align-items:center;gap:8px}.logo-emoji{font-size:28px}h1{font-size:20px;color:var(--pink-deep);letter-spacing:1px;text-shadow:1px 1px 0 #fff}.header-actions{display:flex;gap:6px}.btn{border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;cursor:pointer;transition:all 0.18s;font-family:inherit;touch-action:manipulation}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn-primary{background:var(--pink-strong);color:white}.btn-primary:hover{background:var(--pink-deep)}.btn-ghost{background:rgba(255,255,255,0.7);color:var(--pink-deep);border:1px solid var(--pink-mid)}.btn-ghost:hover{background:var(--pink-soft)}.btn-add{background:var(--pink-strong);color:white;font-weight:600}.btn-add:hover{background:var(--pink-deep)}.btn-tiny{background:transparent;color:var(--pink-deep);font-size:11px;padding:4px 10px;border:1px dashed var(--pink-mid);border-radius:16px}.btn-tiny:hover{background:var(--pink-soft)}.btn-close{background:transparent;font-size:22px;color:var(--text-muted);padding:0 6px}.btn-close:hover{color:var(--pink-deep)}.layout{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}.card{background:rgba(255,255,255,0.85);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid rgba(255,193,217,0.5)}h2{font-size:15px;color:var(--pink-deep);margin-bottom:4px}h3{font-size:14px;color:var(--pink-deep);margin-bottom:6px}.calendar-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calendar-head #monthLabel{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--pink-deep)}.nav-btn{width:30px;height:30px;border:none;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);font-size:18px;cursor:pointer;transition:all 0.15s}.nav-btn:hover{background:var(--pink-mid)}.today-btn{border:1px solid var(--pink-mid);background:#fff;color:var(--pink-deep);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}.today-btn:hover{background:var(--pink-soft)}.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}.calendar-weekdays span{text-align:center;font-size:11px;color:var(--text-muted);padding:3px 0}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:10px;cursor:pointer;font-size:12px;position:relative;background:var(--pink-soft);transition:all 0.15s;max-width:48px;-webkit-tap-highlight-color:transparent}.cal-day:active{background:var(--pink-mid)}.cal-day.other-month{color:var(--text-muted);opacity:0.4}.cal-day.today{background:var(--pink-strong);color:white;font-weight:700}.cal-day.selected{outline:2px solid var(--pink-deep);outline-offset:1px}.cal-day.has-task::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;background:var(--pink-deep);border-radius:50%}.cal-day.achieved::after{content:'\2713';position:absolute;bottom:1px;font-size:9px;color:#fff;background:var(--pink-deep);width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.cal-day.achieved.has-task::after{content:'\2713'}.cal-day.today.achieved::after{background:white;color:var(--pink-deep)}.calendar-legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:10px;color:var(--text-muted)}.calendar-legend span{display:flex;align-items:center;gap:3px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot-task{background:var(--pink-strong)}.dot-done{background:var(--pink-deep)}.dot-today{background:var(--pink-strong)}.task-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}#selectedDateLabel{font-size:15px}.progress-mini{display:flex;align-items:center;gap:6px}#progressText{font-size:12px;font-weight:700;color:var(--pink-deep);min-width:36px;text-align:right}.progress-bar{width:100px;height:8px;background:var(--pink-soft);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-strong),var(--pink-deep));border-radius:4px;transition:width 0.4s;width:0%}.task-add{display:flex;gap:6px;margin-bottom:6px}#taskInput{flex:1;padding:9px 12px;border:2px solid var(--pink-mid);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:#fff;outline:none;transition:border 0.15s}#taskInput:focus{border-color:var(--pink-strong)}.task-quick{margin-bottom:8px}.task-list{display:flex;flex-direction:column;gap:6px}.task-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--pink-mid);transition:all 0.2s}.task-item.done{background:var(--pink-soft);opacity:0.85}.task-item.done .task-title{text-decoration:line-through;color:var(--text-muted)}.task-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--pink-mid);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all 0.15s;-webkit-tap-highlight-color:transparent}.task-check:active{border-color:var(--pink-strong)}.task-item.done .task-check{background:var(--pink-strong);border-color:var(--pink-strong);color:white}.task-body{flex:1;min-width:0}.task-title{font-size:13px;word-break:break-word;line-height:1.4}.task-attach-btn{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:11px;color:var(--pink-deep);background:var(--pink-soft);border:1px solid var(--pink-mid);border-radius:10px;padding:2px 8px;cursor:pointer}.task-attach-btn:active{background:var(--pink-mid)}.task-attach-btn.has-file{background:#E8F5E9;border-color:#A5D6A7;color:#2E7D32}.task-actions{display:flex;gap:2px}.task-del{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px}.task-del:active{color:#E53935;background:#FFEBEE}.task-empty{display:none;flex-direction:column;align-items:center;gap:4px;padding:24px 0;color:var(--text-muted)}.task-empty.show{display:flex}.empty-emoji{font-size:36px}.muted{font-size:11px}.attach-thumb{margin-top:6px;max-width:100px;max-height:60px;border-radius:8px;border:1px solid var(--pink-mid);cursor:pointer;object-fit:cover;display:block}.melody-card{text-align:center}.melody-title{text-align:center;margin-bottom:6px}.melody-stage{position:relative;height:220px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFF0F5 0%,#FFE4ED 100%);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden}.melody-svg{width:180px;height:196px;transition:all 0.5s ease}.melody-happy{animation:bob 3s ease-in-out infinite}.melody-sad{animation:droop 4s ease-in-out infinite;filter:saturate(0.6)}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}.melody-status{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.status-row{display:flex;align-items:center;gap:6px;font-size:11px}.status-label{width:48px;text-align:right;color:var(--text)}.status-bar{flex:1;height:8px;background:var(--pink-soft);border-radius:4px;overflow:hidden}.status-fill{height:100%;border-radius:4px;transition:width 0.6s;width:0%}.status-fill.satiety{background:linear-gradient(90deg,#FFD54F,#FF9800)}.status-fill.clean{background:linear-gradient(90deg,#81D4FA,#29B6F6)}.melody-bubble{background:#fff;border:2px solid var(--pink-mid);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--pink-deep);margin:0 auto 10px;max-width:90%;position:relative;min-height:18px;transition:all 0.3s}.melody-bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}.melody-stats{display:flex;gap:8px}.stat{flex:1;background:var(--pink-soft);border-radius:var(--radius-sm);padding:6px;text-align:center}.stat-num{display:block;font-size:20px;font-weight:700;color:var(--pink-deep)}.stat-label{font-size:10px;color:var(--text-muted)}.tip-card{margin-top:auto}.tip-list{padding-left:18px;font-size:11px;color:var(--text);line-height:1.6}.modal{display:none;position:fixed;inset:0;background:rgba(74,44,58,0.4);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-content{background:#fff;border-radius:var(--radius);padding:16px;width:100%;max-width:440px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.2)}.media-modal{max-width:96vw}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal-foot{margin-top:12px;display:flex;justify-content:flex-end;gap:6px}.template-add{display:flex;gap:6px;margin-bottom:10px}.template-add input{flex:1;padding:7px 10px;border:2px solid var(--pink-mid);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}.template-add input:focus{border-color:var(--pink-strong)}.template-list{display:flex;flex-direction:column;gap:5px}.template-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--pink-soft);border-radius:var(--radius-sm);font-size:13px}.media-stage{display:flex;align-items:center;justify-content:center;min-height:180px;background:#000;border-radius:var(--radius-sm);overflow:hidden}.media-stage img,.media-stage video{max-width:100%;max-height:50vh}.celebrate-overlay{display:none;position:fixed;inset:0;background:rgba(255,228,237,0.95);z-index:200;align-items:center;justify-content:center;flex-direction:column}.celebrate-overlay.show{display:flex;animation:fadeIn 0.3s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.celebrate-scene{text-align:center}.celebrate-step{display:none;flex-direction:column;align-items:center;gap:10px}.celebrate-step.active{display:flex;animation:popIn 0.5s}@keyframes popIn{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}.big-emoji{font-size:80px;animation:wiggle 0.8s ease-in-out infinite}@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.celebrate-step p{font-size:20px;color:var(--pink-deep);font-weight:600}
  </style>
</head>
<body>

  <header class="app-header">
    <div class="title-block"><span class="logo-emoji">🎀</span><h1>含含开心学习</h1></div>
    <div class="header-actions"><button class="btn btn-ghost" id="syncBtn">🔄 同步</button><button class="btn btn-ghost" id="templateBtn">📋 模板</button></div>
  </header>
  <main class="layout">
    <!-- Token 设置弹窗 -->
    <div class="modal" id="syncModal">
      <div class="modal-content">
        <div class="modal-head"><h3>🔄 多设备同步设置</h3><button class="btn btn-close" id="closeSync">×</button></div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">输入 GitHub Token，妈妈和孩子就能看到同一份数据。</p>
        <input type="password" id="tokenInput" placeholder="粘贴 GitHub Token (ghp_...)" style="width:100%;padding:10px;border:2px solid var(--pink-mid);border-radius:var(--radius-sm);font-size:13px;font-family:monospace;" />
        <div class="modal-foot" style="margin-top:12px;">
          <button class="btn btn-ghost" id="howToToken">❓ 怎么获取</button>
          <button class="btn btn-primary" id="saveTokenBtn">💾 保存</button>
        </div>
        <p id="syncStatus" style="font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center;"></p>
      </div>
    </div>
    <section class="card calendar-card">
      <div class="calendar-head">
        <button class="nav-btn" id="prevMonth">‹</button><span id="monthLabel"></span><button class="nav-btn" id="nextMonth">›</button><button class="today-btn" id="todayBtn">今天</button>
      </div>
      <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-legend"><span><i class="dot dot-task"></i>有任务</span><span><i class="dot dot-done"></i>已达标</span><span><i class="dot dot-today"></i>今天</span></div>
    </section>
    <section class="card task-card">
      <div class="task-head"><h2 id="selectedDateLabel"></h2><div class="progress-mini"><span id="progressText">0%</span><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></div>
      <div class="task-add"><input type="text" id="taskInput" placeholder="✏️ 输入任务，按回车添加" /><button class="btn btn-add" id="addTaskBtn">＋ 添加</button></div>
      <div class="task-quick"><button class="btn btn-tiny" id="useTemplateBtn">⭐ 从模板带入今天</button></div>
      <div class="task-list" id="taskList"></div>
      <div class="task-empty show" id="taskEmpty"><span class="empty-emoji">🌸</span><p>今天还没有任务</p><p class="muted">在上方输入框添加你的学习计划吧</p></div>
    </section>
    <section class="card melody-card">
      <h2 class="melody-title">🐱 美乐蒂</h2>
      <div class="melody-stage" id="melodyStage"></div>
      <div class="melody-status">
        <div class="status-row"><span class="status-label">饱腹度</span><div class="status-bar"><div class="status-fill satiety" id="satietyBar"></div></div><span id="satietyText">0%</span></div>
        <div class="status-row"><span class="status-label">清洁度</span><div class="status-bar"><div class="status-fill clean" id="cleanBar"></div></div><span id="cleanText">0%</span></div>
      </div>
      <div class="melody-bubble" id="melodyBubble"></div>
      <div class="melody-stats"><div class="stat"><span class="stat-num" id="streakDays">0</span><span class="stat-label">连续达标</span></div><div class="stat"><span class="stat-num" id="totalDays">0</span><span class="stat-label">累计达标</span></div></div>
    </section>
    <section class="card tip-card"><h3>💡 使用说明</h3><ul class="tip-list"><li>点击日历选择日期，每天可手动添加学习任务</li><li>每项任务完成后点 ☑️，并可上传照片或视频</li><li>当天完成 ≥ 70%，美乐蒂就能吃饱洗澡</li><li>常用任务可存为模板，一键带入</li></ul></section>
  </main>
  <div class="modal" id="templateModal">
    <div class="modal-content">
      <div class="modal-head"><h3>📋 常用任务模板</h3><button class="btn btn-close" id="closeTemplate">×</button></div>
      <div class="template-add"><input type="text" id="templateInput" placeholder="如：练字一页" /><button class="btn btn-add" id="addTemplateBtn">＋ 存为模板</button></div>
      <div class="template-list" id="templateList"></div>
      <div class="modal-foot"><button class="btn btn-primary" id="applyTemplateBtn">✅ 一键带入今天</button></div>
    </div>
  </div>
  <div class="modal" id="attachModal">
    <div class="modal-content media-modal">
      <div class="modal-head"><h3 id="attachTitle">附件预览</h3><button class="btn btn-close" id="closeAttach">×</button></div>
      <div class="media-stage" id="mediaStage"></div>
    </div>
  </div>
  <div class="celebrate-overlay" id="celebrateOverlay"></div>
  
  
  
  





<script src="melody.js?v=2"></script>
<script src="web-api.js?v=2"></script>
<script src="renderer.js?v=2"></script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("./sw.js?v=2")}</script>
</body>
</html>
